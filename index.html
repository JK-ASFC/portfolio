<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>LEONE</title>
  <meta name="description" content="Événements de la résidence LEONE · LEONE residence events">
  <meta name="theme-color" content="#14123a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffd23f'/><stop offset='1' stop-color='%23ff4f1f'/></linearGradient></defs><circle cx='32' cy='32' r='30' fill='url(%23g)'/><rect x='0' y='36' width='64' height='4' fill='%2314123a'/><rect x='0' y='46' width='64' height='5' fill='%2314123a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>

  <header class="topbar" id="topbar">
    <a href="#/" class="logo" aria-label="LEONE">
      <span class="logo-sun" aria-hidden="true"></span>
      <span class="logo-word">LEONE</span>
    </a>
    <nav class="nav" id="nav" data-i18n-aria="nav.label">
      <a href="#/" data-nav="home"><span class="nav-ico" aria-hidden="true">📅</span><span data-i18n="nav.events"></span></a>
      <a href="#/propose" data-nav="propose"><span class="nav-ico" aria-hidden="true">💡</span><span data-i18n="nav.propose"></span></a>
      <a href="#/pot" data-nav="pot"><span class="nav-ico" aria-hidden="true">🪙</span><span data-i18n="nav.pot"></span></a>
      <a href="#/admin" data-nav="admin" class="nav-admin"><span class="nav-ico" aria-hidden="true">🔐</span><span data-i18n="nav.admin"></span></a>
    </nav>
    <div class="top-actions">
      <div class="lang" role="group" data-i18n-aria="lang.label">
        <button type="button" data-lang="fr" lang="fr" aria-label="Français">FR</button>
        <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
      </div>
    </div>
  </header>

  <div class="demo-banner" id="demoBanner" hidden>
    <span data-i18n-html="demo.banner"></span>
    <button class="demo-close" id="demoClose" data-i18n-aria="demo.close">✕</button>
  </div>

  <main id="main">

    <!-- ============ ACCUEIL = LISTE DES ÉVÉNEMENTS ============ -->
    <section class="view" data-view="home">
      <div class="hero">
        <div class="hero-sky" aria-hidden="true">
          <div class="stars"></div>
          <div class="sun"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="hero-grid" aria-hidden="true"></div>
        <div class="hero-content">
          <h1 class="hero-title">LEONE</h1>
          <p class="kicker" data-i18n="home.kicker"></p>
          <a class="btn btn-wa wa-link" href="#" target="_blank" rel="noopener noreferrer" hidden><svg class="wa-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg><span data-i18n="wa.join"></span></a>
        </div>
        <aside class="next-card" id="nextCard" aria-live="polite"></aside>
      </div>

      <section class="block">
        <div class="list-head">
          <h2 data-i18n="home.title"></h2>
          <div class="filters" id="filters" role="tablist" data-i18n-aria="filter.aria">
            <button class="chip is-active" data-filter="upcoming" role="tab" aria-selected="true" data-i18n="filter.upcoming"></button>
            <button class="chip" data-filter="past" role="tab" aria-selected="false" data-i18n="filter.past"></button>
          </div>
        </div>
        <div class="cards" id="eventList"></div>
      </section>
    </section>

    <!-- ============ DÉTAIL ÉVÉNEMENT ============ -->
    <section class="view" data-view="event" hidden>
      <div id="eventDetail"></div>
    </section>

    <!-- ============ PROPOSER ============ -->
    <section class="view" data-view="propose" hidden>
      <div class="page-head">
        <h1 data-i18n="prop.title"></h1>
        <p class="lead" data-i18n="prop.lead"></p>
      </div>
      <div class="block" id="proposeRoot"></div>
    </section>

    <!-- ============ POT COMMUN ============ -->
    <section class="view" data-view="pot" hidden>
      <div class="page-head">
        <h1 data-i18n="pot.title"></h1>
      </div>
      <div class="block" id="potRoot"></div>
    </section>

    <!-- ============ ORGANISER ============ -->
    <section class="view" data-view="admin" hidden>
      <div class="page-head">
        <h1 data-i18n="admin.title"></h1>
      </div>
      <div class="block" id="adminRoot"></div>
    </section>

  </main>

  <footer class="footer">
    <p class="footer-logo">LEONE</p>
    <p class="footer-privacy" data-i18n="footer.privacy"></p>
    <p class="footer-wa"><a class="wa-link" href="#" target="_blank" rel="noopener noreferrer" hidden><svg class="wa-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg><span data-i18n="wa.footer"></span></a></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
